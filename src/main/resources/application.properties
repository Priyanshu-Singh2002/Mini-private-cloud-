spring.application.name=mini-cloud

# Datasource credentials must come from environment variables:
# DB_URL, DB_USERNAME, DB_PASSWORD (set in PowerShell or the OS).
# Spring Boot does not load dotenv files by itself. The optional import below
# is native Spring config (no extra library) and is overridden by OS env vars.
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/minicloud_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
