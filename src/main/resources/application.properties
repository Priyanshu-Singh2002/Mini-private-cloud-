spring.application.name=mini-cloud

# Datasource credentials must come from environment variables:
# DB_URL, DB_USERNAME, DB_PASSWORD (set in PowerShell or the OS).
# Spring Boot does not load dotenv files by itself. The optional import below
# is native Spring config (no extra library) and is overridden by OS env vars.
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/minicloud_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET}


# Cloud file storage
app.storage.location=storage

# Prototype job queue: bounded workers, no preemption of running jobs.
app.jobs.worker-threads=2
app.jobs.max-queued-global=50
app.jobs.max-active-per-user=10
app.jobs.max-input-bytes=1048576
app.jobs.max-batch-values=2000
app.jobs.dispatch-interval-ms=250


app.admin.setup-secret=${ADMIN_SETUP_SECRET}

# Temporary admin bootstrap configuration
app.admin.bootstrap-enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.setup-secret=${ADMIN_SETUP_SECRET:}


